<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تريفيا ماستر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a12;font-family:"Tajawal",sans-serif;color:#fff;min-height:100vh}
input,button{font-family:"Tajawal",sans-serif}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.anim{animation:fadeIn .4s ease}
button:active{transform:scale(.97)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:4px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#10101e;border-bottom:1px solid #1e1e3a;position:sticky;top:0;z-index:50}
.nav-logo{color:#00f5d4;font-weight:900;font-size:16px;cursor:pointer}
.nav-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:6px 8px;border-radius:8px}
.page{padding:14px;max-width:600px;margin:0 auto}
.card{background:#10101e;border:1px solid #1e1e3a;border-radius:16px;padding:16px;margin-bottom:13px;min-height:100px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt-btn{border:1px solid #383858;border-radius:13px;padding:12px 10px;cursor:pointer;color:#fff;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center;transition:background .3s,border-color .3s,box-shadow .3s;width:100%;text-align:right;min-height:52px;background:#12121e;}
.opt-btn:not([disabled]):hover{border-color:#6c63ff88;box-shadow:0 0 10px #6c63ff22;transform:translateY(-1px);}
.opt-ltr{background:#ffffff18;border-radius:6px;padding:2px 7px;font-size:12px;flex-shrink:0}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat-btn{background:#10101e;border-radius:16px;padding:22px 14px;cursor:pointer;text-align:center;transition:transform .2s;width:100%}
.cat-btn:hover{transform:scale(1.03)}
.level-bar{display:flex;gap:3px;margin-bottom:12px}
.inp{display:block;width:100%;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:15px;padding:11px 14px;margin-bottom:10px;outline:none}
.btn-main{display:block;width:100%;border:none;border-radius:10px;color:#fff;font-weight:700;font-size:16px;padding:12px;cursor:pointer;margin-top:6px}
.leader-row{display:flex;align-items:center;gap:12px;background:#10101e;border-radius:12px;padding:11px 14px;margin-bottom:8px}
.badge{font-size:10px;border-radius:4px;padding:1px 6px}
.ad-top{width:100%;background:#0d0d1e;border-bottom:1px solid #1e1e3a;display:flex;align-items:center;justify-content:center;min-height:58px;padding:4px 0}
.ad-slot{border:1.5px dashed #2a2a5a;border-radius:10px;width:calc(100% - 20px);max-width:728px;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;color:#3a3a6a;font-size:13px;font-weight:600;background:repeating-linear-gradient(45deg,#0d0d1e,#0d0d1e 10px,#10101e 10px,#10101e 20px)}
.ad-bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#0d0d1e;border-top:1px solid #1e1e3a;display:flex;align-items:center;justify-content:center;min-height:50px;padding:3px 0}
.ad-slot-b{border:1.5px dashed #2a4a2a;border-radius:10px;width:calc(100% - 20px);max-width:728px;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;color:#3a5a3a;font-size:13px;font-weight:600;background:repeating-linear-gradient(45deg,#0d0d1e,#0d0d1e 10px,#0e110e 10px,#0e110e 20px)}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.popup-box{background:#10101e;border:1px solid #2a2a4a;border-radius:20px;width:100%;max-width:340px;overflow:hidden}
.timer-wrap{position:relative;width:64px;height:64px;flex-shrink:0;will-change:contents}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;transition:color .3s}
.progress-bar{height:7px;background:#1a1a2e;border-radius:4px;overflow:hidden;margin-bottom:8px}
.center-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:10px;text-align:center;padding:20px;animation:fadeIn .5s}
.score-box{background:#10101e;border:1px solid #2a2a3e;border-radius:14px;padding:14px 28px;margin:6px 0;min-width:220px;text-align:center}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:8px 14px;background:#10101e;border-radius:12px}

/* ═══ SPORT BACKGROUNDS & EFFECTS ═══ */
body{background:#0a0a12;background-image:radial-gradient(ellipse at 20% 50%,#1a0a2e 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#0a1a2e 0%,transparent 60%);}
.sport-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
.sport-bg::before{content:"⚽ 🏀 🎯 🏆 ⚡ 🔥 ⭐ 🏅";position:absolute;font-size:120px;opacity:.03;top:-20px;left:-20px;white-space:nowrap;animation:bgFloat 20s linear infinite;}
.sport-bg::after{content:"🥇 🎖️ 🏋️ 🤸 ⚽ 🏆 🎯 🔥";position:absolute;font-size:100px;opacity:.025;bottom:-20px;right:-20px;white-space:nowrap;animation:bgFloat 25s linear infinite reverse;}
@keyframes bgFloat{0%{transform:translateX(0) rotate(0deg);}100%{transform:translateX(-50%) rotate(10deg);}}

/* confetti particle */
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;border-radius:2px;animation:confettiFall linear forwards;pointer-events:none;z-index:9999;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* correct answer flash */
@keyframes correctFlash{0%{box-shadow:0 0 0 0 #00f5d488;}50%{box-shadow:0 0 0 20px #00f5d400;}100%{box-shadow:0 0 0 0 #00f5d400;}}
.correct-flash{animation:correctFlash .6s ease-out!important;}

/* wrong answer shake */
@keyframes wrongShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.wrong-shake{animation:wrongShake .4s ease-out!important;}

/* score popup */
@keyframes scorePopup{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-60px) scale(1.5);opacity:0;}}
.score-popup{position:fixed;font-size:22px;font-weight:900;color:#f7b731;pointer-events:none;z-index:9999;animation:scorePopup .9s ease-out forwards;}

/* leaderboard live badge */
@keyframes newEntry{0%{transform:scaleX(0);opacity:0;}100%{transform:scaleX(1);opacity:1;}}
.new-entry{animation:newEntry .4s ease-out;}

/* fire gradient backgrounds per level */

/* Level 1-3: Bright & Cheerful */
.lvl-bg-1{background:linear-gradient(135deg,#0d1f3c,#1a3a5c,#0d2e1f)!important;}
.lvl-bg-2{background:linear-gradient(135deg,#1a0d3c,#2e1a5c,#0d1f3c)!important;}
.lvl-bg-3{background:linear-gradient(135deg,#0d2e1f,#1a5c2e,#0d3c2e)!important;}
/* Level 4-6: Medium tension */
.lvl-bg-4{background:linear-gradient(135deg,#2e1a0d,#5c2e0d,#3c1a0d)!important;}
.lvl-bg-5{background:linear-gradient(135deg,#2e0d1a,#5c1a2e,#3c0d1a)!important;}
.lvl-bg-6{background:linear-gradient(135deg,#3c1a00,#6b2d00,#4a1a00)!important;}
/* Level 7-9: High tension red/orange fire */
.lvl-bg-7{background:linear-gradient(135deg,#4a1000,#8b1a00,#5c1400)!important;}
.lvl-bg-8{background:linear-gradient(135deg,#5c0800,#a01500,#6e0a00)!important;}
.lvl-bg-9{background:linear-gradient(135deg,#6e0400,#b81000,#800600)!important;}
/* Level 10: LEGENDARY - dark red pulsing */
.lvl-bg-10{background:linear-gradient(135deg,#1a0000,#8b0000,#2d0000)!important;animation:lvl10Pulse 2s ease-in-out infinite!important;}
@keyframes lvl10Pulse{0%,100%{background:linear-gradient(135deg,#1a0000,#8b0000,#2d0000);}50%{background:linear-gradient(135deg,#2d0000,#cc0000,#3a0000);}}

/* question card glow per category + level intensity */
.card-science{border-color:#00f5d4!important;box-shadow:0 0 25px #00f5d433;}
.card-history{border-color:#f7b731!important;box-shadow:0 0 25px #f7b73133;}
.card-geo{border-color:#6c63ff!important;box-shadow:0 0 25px #6c63ff33;}
.card-sports{border-color:#ff4d6d!important;box-shadow:0 0 25px #ff4d6d33;}
.card-intense{border-width:2px!important;animation:cardPulse 1.5s ease-in-out infinite;}
@keyframes cardPulse{0%,100%{box-shadow:0 0 20px currentColor;}50%{box-shadow:0 0 40px currentColor,0 0 80px currentColor;}}
.card-legend{border-width:3px!important;animation:legendCard 1s ease-in-out infinite;}
@keyframes legendCard{0%,100%{box-shadow:0 0 30px #ff000066,0 0 60px #ff000033;}50%{box-shadow:0 0 60px #ff0000aa,0 0 120px #ff000055;}}

/* live leaderboard sidebar */
.live-board{position:fixed;left:0;top:50%;transform:translateY(-50%);background:#10101eee;border:1px solid #1e1e3a;border-right:none;border-radius:0 0 0 0;padding:8px 6px;z-index:30;max-width:140px;border-radius:12px 0 0 12px;backdrop-filter:blur(8px);}
.live-board-title{color:#f7b731;font-size:11px;font-weight:700;text-align:center;margin-bottom:6px;}
.live-board-row{display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:1px solid #1a1a2e;}
.live-board-row:last-child{border:none;}

@media(max-width:600px){.live-board{display:none;}}

.prize-banner{background:linear-gradient(135deg,#0d2e0d,#1a4a10);border:2px solid #4CAF50;border-radius:14px;padding:14px 16px;margin:12px 0;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;}
.prize-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#4CAF5018,transparent);animation:shimmer 2.5s infinite;}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.prize-icon{font-size:40px;flex-shrink:0;animation:bounce2 1.5s ease-in-out infinite;}
@keyframes bounce2{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.prize-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#7CFC00);border-radius:4px;transition:width .6s;}
</style>
</head>
<body>
<div class="sport-bg"></div><div id="app"></div>

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else if(k==="disabled")el.disabled=v;
    else if(k==="dir")el.dir=v;
    else if(k==="type")el.type=v;
    else if(k==="placeholder")el.placeholder=v;
    else if(k==="value"){el.value=v;}
    else el.setAttribute(k,v);
  });
  kids.flat().forEach(c=>{if(c==null)return;el.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return el;
}

let STATE={
  user:ls("tqv3_user",null),
  screen:"home",
  scores:ls("tqv3_scores",[]),
  showAdmin:false,
  adminPrompt:false,
  adminCode:"",
  game:{phase:"pick",catKey:null,level:1,questions:[],qIdx:0,score:0,timeLeft:QUESTION_TIME,answered:null,showAd:false,pendingNext:null,usedCats:[]},
};
let timerInterval=null;

function setState(patch){
  if(typeof patch==="function")patch=patch(STATE);
  Object.assign(STATE,patch);
  render();
}
function setGame(patch){
  const g=typeof patch==="function"?patch(STATE.game):{...STATE.game,...patch};
  STATE.game=g;
  render();
}

/* ═══ RENDER ENGINE ═══ */
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(!STATE.user){app.appendChild(renderLogin());return;}
  app.appendChild(renderNav());
  app.appendChild(renderAdTop());
  if(STATE.adminPrompt)app.appendChild(renderAdminPrompt());
  if(STATE.showAdmin)app.appendChild(renderAdmin());
  if(STATE.screen==="home")app.appendChild(renderHome());
  else if(STATE.screen==="game")app.appendChild(renderGame());
  else if(STATE.screen==="leaderboard")app.appendChild(renderLeaderboard());
  app.appendChild(renderAdBottom());
}

function renderLogin(){
  let mode="phone",name="",phone="";
  const wrap=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"radial-gradient(ellipse at 50% 30%,#1a0a2e,#0a0a12)"}});
  const card=h("div",{style:{background:"#10101e",border:"1px solid #1e1e3a",borderRadius:"20px",padding:"32px 24px",width:"100%",maxWidth:"380px",textAlign:"center"}});

  const tabs=h("div",{style:{display:"flex",background:"#0d0d1e",borderRadius:"10px",overflow:"hidden",marginBottom:"18px"}});
  const makeTab=(m,l,c)=>{
    const b=h("button",{style:{flex:"1",padding:"10px",border:"none",background:"transparent",cursor:"pointer",fontWeight:"600",fontSize:"14px",color:mode===m?c:"#555",borderBottom:mode===m?"2px solid "+c:"2px solid transparent"},onClick:()=>{mode=m;rerenderCard();}},l);
    return b;
  };
  const errEl=h("p",{style:{color:"#ff4d6d",fontSize:"13px",marginBottom:"8px",display:"none"}});
  const nameInp=h("input",{className:"inp",placeholder:"اسمك في المتصدرين",onInput:e=>name=e.target.value});
  const phoneInp=h("input",{className:"inp",placeholder:"رقم هاتفك",dir:"ltr",onInput:e=>phone=e.target.value});
  const guestNote=h("div",{style:{background:"#f7b73112",border:"1px solid #f7b73133",borderRadius:"10px",padding:"7px 12px",color:"#f7b731",fontSize:"13px",marginBottom:"10px",display:"none"}},"👤 دخول فوري بدون تحقق أو كود");
  const noteEl=h("p",{style:{color:"#333",fontSize:"11px",marginTop:"8px"}},"رقم الهاتف للهوية فقط — بدون إرسال أي كود");
  const btn=h("button",{className:"btn-main",style:{background:"linear-gradient(135deg,#00f5d4,#6c63ff)"},onClick:()=>{
    if(!name.trim()){errEl.style.display="block";errEl.textContent="أدخل اسمك";return;}
    if(mode==="phone"&&!/^[0-9]{8,13}$/.test(phone.replace(/\s/g,""))){errEl.style.display="block";errEl.textContent="رقم هاتف غير صالح";return;}
    const u={name:name.trim(),phone:mode==="phone"?phone:"ضيف",isGuest:mode==="guest"};
    ss("tqv3_user",u);setState({user:u,screen:"home"});
  }},"🚀 ابدأ اللعب");

  function rerenderCard(){
    tabs.innerHTML="";
    tabs.appendChild(makeTab("phone","📱 رقم الهاتف","#00f5d4"));
    tabs.appendChild(makeTab("guest","👤 دخول كضيف","#f7b731"));
    phoneInp.style.display=mode==="phone"?"block":"none";
    guestNote.style.display=mode==="guest"?"block":"none";
    noteEl.style.display=mode==="phone"?"block":"none";
    btn.style.background=mode==="phone"?"linear-gradient(135deg,#00f5d4,#6c63ff)":"linear-gradient(135deg,#f7b731,#e67e22)";
    btn.textContent=mode==="phone"?"🚀 ابدأ اللعب":"👤 دخول كضيف";
  }
  rerenderCard();

  card.append(
    h("div",{style:{fontSize:"60px"}},"🎯"),
    h("h1",{style:{fontSize:"28px",fontWeight:"900",color:"#00f5d4",margin:"8px 0 4px"}},"تريفيا ماستر"),
    h("p",{style:{color:"#555",marginBottom:"20px",fontSize:"13px"}},"400 سؤال ● 4 أقسام ● 10 مستويات 🔥"),
    tabs,nameInp,phoneInp,guestNote,errEl,btn,noteEl
  );
  wrap.appendChild(card);
  return wrap;
}

/* ═══ TIMER SVG ═══ */
function renderTimer(timeLeft){
  const r=26,circ=2*Math.PI*r;
  const color=timeLeft>10?"#00f5d4":timeLeft>5?"#f7b731":"#ff4d6d";
  const wrap=h("div",{className:"timer-wrap"});
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width","64");svg.setAttribute("height","64");
  svg.style.transform="rotate(-90deg)";
  const bg=document.createElementNS("http://www.w3.org/2000/svg","circle");
  bg.setAttribute("cx","32");bg.setAttribute("cy","32");bg.setAttribute("r",r);bg.setAttribute("fill","none");bg.setAttribute("stroke","#222");bg.setAttribute("stroke-width","5");
  const fg=document.createElementNS("http://www.w3.org/2000/svg","circle");
  fg.setAttribute("cx","32");fg.setAttribute("cy","32");fg.setAttribute("r",r);fg.setAttribute("fill","none");fg.setAttribute("stroke",color);fg.setAttribute("stroke-width","5");
  fg.setAttribute("stroke-dasharray",circ);fg.setAttribute("stroke-dashoffset",circ*(1-timeLeft/QUESTION_TIME));
  fg.setAttribute("class","timer-fg");
  fg.style.transition="stroke-dashoffset 1s linear,stroke .3s";
  svg.append(bg,fg);
  const num=h("span",{className:"timer-num",style:{color}},String(timeLeft));
  wrap.append(svg,num);
  return wrap;
}

/* ═══ GAME ═══ */
function startTimer(){
  updateBodyBg(STATE.game.level||1);
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    const t=STATE.game.timeLeft-1;
    if(t<=0){clearInterval(timerInterval);handleAnswer(-1);return;}
    STATE.game.timeLeft=t;
    // Update timer in-place without full re-render
    const numEl=document.querySelector(".timer-num");
    const fgEl=document.querySelector(".timer-fg");
    if(numEl&&fgEl){
      const r=26,circ=2*Math.PI*r;
      const color=t>10?"#00f5d4":t>5?"#f7b731":"#ff4d6d";
      numEl.textContent=String(t);
      numEl.style.color=color;
      fgEl.setAttribute("stroke-dashoffset",circ*(1-t/QUESTION_TIME));
      fgEl.setAttribute("stroke",color);
    } else {
      setGame({timeLeft:t});
    }
  },1000);
}

function loadLevel(key,lvl){
  const pool=shuffle((ALL_QUESTIONS[key]||[]).filter(q=>q.lvl===lvl));
  setGame({questions:pool,qIdx:0,answered:null,timeLeft:QUESTION_TIME,phase:"playing"});
  setTimeout(startTimer,50);
}

function handleAnswer(idx){
  if(STATE.game.answered!==null)return;
  clearInterval(timerInterval);
  const g=STATE.game;
  const q=g.questions[g.qIdx];
  let score=g.score;
  const correct=q&&q.a===idx;
  const pts=g.timeLeft*g.level;
  if(correct){
    score+=pts;
    setTimeout(()=>{launchConfetti(40+Math.random()*20);},100);
    setTimeout(()=>{flashOptBtn(idx,true);},50);
    setTimeout(()=>{showScorePopup(pts,document.querySelector(".opt-btn"));},200);
  } else if(idx>=0){
    setTimeout(()=>{flashOptBtn(idx,false);},50);
  }
  setGame({answered:idx,score});
  // Add to leaderboard live
  updateLiveBoard();
  setTimeout(()=>{
    const g2=STATE.game;
    const isLastQ=g2.qIdx+1>=g2.questions.length;
    if(!isLastQ){
      if((g2.qIdx+1)%5===0){setGame({pendingNext:g2.qIdx+1,showAd:true,answered:null});}
      else{setGame({qIdx:g2.qIdx+1,answered:null,timeLeft:QUESTION_TIME});setTimeout(startTimer,50);}
    }else{
      if(g2.level<LEVELS)setGame({phase:"levelDone",answered:null});
      else setGame({phase:"catDone",answered:null});
    }
  },1300);
}

      if(isNaN(sc)||sc<0){errEl.style.display="block";errEl.textContent="نقاط غير صالحة";return;}
      errEl.style.display="none";
      STATE.scores.push({name:fp.name.trim(),phone:fp.phone||"—",score:sc,date:new Date().toLocaleDateString("ar"),isFake:true});

      listWrap.innerHTML="";
      let sorted=[...STATE.scores].sort((a,b)=>b.score-a.score);
      if(searchTerm.trim()){
        const q=searchTerm.trim().toLowerCase();
        sorted=sorted.filter(s=>(s.name||"").toLowerCase().includes(q)||(s.phone||"").includes(q));

      if(sorted.length===0){

        const origIdx=STATE.scores.indexOf(s);
        const isWinner=s.score>=5000;
        const row=document.createElement("div");
        row.style.cssText="display:flex;align-items:center;gap:8px;padding:9px 8px;border-bottom:1px solid #141424;border-radius:8px;background:"+(isWinner?"#0d1f0d":i%2===0?"#0a0a14":"transparent")+";margin-bottom:2px";

        const nameDiv=document.createElement("div");

        if(isWinner)nameDiv.appendChild(badge("🏆 فائز","#4CAF5033","#7CFC00"));
        if(s.isFake)nameDiv.appendChild(badge("افتراضي","#6c63ff33","#a29bfe"));
        if(s.isGuest)nameDiv.appendChild(badge("ضيف","#f7b73122","#f7b731"));

        const phoneDiv=document.createElement("div");
        phoneDiv.style.cssText="color:#555;font-size:11px;margin-top:2px";
        phoneDiv.textContent="📱 "+(s.phone||"—")+"   "+(s.date||"");

        const info=document.createElement("div"); info.style.flex="1"; info.style.minWidth="0";
        info.append(nameDiv,phoneDiv);

        const scoreDiv=document.createElement("div"); scoreDiv.style.cssText="text-align:center;flex-shrink:0";
        scoreDiv.innerHTML='<div style="color:'+(isWinner?"#7CFC00":"#00f5d4")+';font-weight:800;font-size:15px">'+s.score+'</div><div style="color:#444;font-size:10px">نقطة</div>';

        const delBtn=document.createElement("button");
        delBtn.style.cssText="background:#1a1a2e;border:none;border-radius:6px;cursor:pointer;padding:4px 8px;color:#ff4d6d;font-size:12px;flex-shrink:0";
        delBtn.textContent="🗑️";
        delBtn.addEventListener("click",()=>{

          info,scoreDiv,delBtn

/* ═══ APPLY ADS ═══ */
function applyAds(){
  const ads=ls("tqv3_ads",{top:"",bottom:"",popup:""});
  ["top","bottom","popup"].forEach(k=>{
    const el=document.getElementById("ad-"+k);
    if(el&&ads[k]){el.innerHTML=ads[k];el.style.display="flex";}

/* ═══ TOAST ═══ */
function showToast(msg){
  const t=h("div",{style:{position:"fixed",bottom:"70px",left:"50%",transform:"translateX(-50%)",background:"#1a3a1a",border:"1px solid #00f5d4",borderRadius:"10px",color:"#00f5d4",padding:"10px 20px",fontSize:"14px",fontWeight:"700",zIndex:"999",whiteSpace:"nowrap"}},msg);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}




function showLevelTransition(level){
  const colors=["","#00f5d4","#00d4aa","#6c63ff","#f7b731","#ff8c00","#ff6600","#ff4400","#ff2200","#cc0000","#ff0000"];
  const names=LEVEL_NAMES;
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:"+colors[level]+"22;backdrop-filter:blur(8px);animation:fadeIn .3s;";
  overlay.innerHTML='<div style="font-size:72px;animation:pulse 1s infinite">'+(level===10?"👑":level>=7?"🔥":level>=4?"⚡":"⭐")+'</div><h2 style="color:'+colors[level]+';font-size:28px;font-weight:900;margin:12px 0 4px">المستوى '+level+'</h2><p style="color:'+colors[level]+'aa;font-size:18px;margin:0">'+names[level]+'</p><div style="margin-top:20px;height:6px;width:200px;background:#ffffff22;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+((level/10)*100)+'%;background:'+colors[level]+';border-radius:3px;transition:width 1s"></div></div>';
  document.body.appendChild(overlay);
  setTimeout(()=>{overlay.style.animation="none";overlay.style.opacity="0";overlay.style.transition="opacity .4s";},1600);
  setTimeout(()=>overlay.remove(),2000);
}

/* PRIZE BANNER */
function renderPrizeBanner(score){
  const target=5000, pct=Math.min(100,Math.round((score/target)*100)), reached=score>=target;
  const wrap=document.createElement("div"); wrap.className="prize-banner";
  const icon=document.createElement("div"); icon.className="prize-icon"; icon.textContent=reached?"🏆":"💰";
  const text=document.createElement("div"); text.style.flex="1";
  if(reached){
    text.innerHTML='<div style="color:#ffd700;font-weight:900;font-size:16px;margin-bottom:4px">🎉 مبروك! وصلت للجائزة!</div><div style="color:#90EE90;font-size:13px">جمعت '+score+' نقطة — تواصل معنا لاستلام 50 جنيه 🎁</div>';
  } else {
    const remaining=target-score;
    text.innerHTML='<div style="color:#7CFC00;font-weight:900;font-size:15px;margin-bottom:3px">🏆 اجمع 5,000 نقطة واكسب 50 جنيه!</div><div style="color:#90EE90;font-size:12px;margin-bottom:8px">متبقي '+remaining.toLocaleString()+' نقطة للجائزة</div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#4CAF50;font-size:11px;font-weight:700">'+score.toLocaleString()+' نقطة</span><span style="color:#4CAF5088;font-size:11px">'+pct+'%</span></div><div style="height:8px;background:#1a2e0d;border-radius:4px;overflow:hidden;border:1px solid #4CAF5033"><div class="prize-fill" style="width:'+pct+'%"></div></div><div style="display:flex;justify-content:space-between;margin-top:3px"><span style="color:#4CAF5066;font-size:10px">0</span><span style="color:#7CFC00;font-size:10px;font-weight:700">🎯 5,000 نقطة = 50 جنيه</span></div>';
  }
  wrap.append(icon,text); return wrap;
}

/* ═══ LIVE LEADERBOARD ═══ */
function updateLiveBoard(){
  const board=document.getElementById("live-board");
  if(!board)return;
  const sorted=[...STATE.scores].sort((a,b)=>b.score-a.score).slice(0,5);
  board.innerHTML="";
  board.appendChild(Object.assign(document.createElement("div"),{className:"live-board-title",textContent:"🏆 المتصدرون"}));
  const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
  sorted.forEach((s,i)=>{
    const row=document.createElement("div");
    row.className="live-board-row";
    row.innerHTML='<span style="font-size:12px">'+medals[i]+'</span><span style="flex:1;color:#ccc;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.name+'</span><span style="color:#00f5d4;font-size:11px;font-weight:700">'+s.score+'</span>';
    board.appendChild(row);
  });
  if(sorted.length===0){
    const empty=document.createElement("p");
    empty.style.cssText="color:#444;font-size:11px;text-align:center;margin:4px 0";
    empty.textContent="لا يوجد بعد";
    board.appendChild(empty);
  }
}

/* ═══ CONFETTI & EFFECTS ═══ */
function launchConfetti(x,y){
  const colors=["#00f5d4","#f7b731","#ff4d6d","#6c63ff","#fff","#ffd700"];
  for(let i=0;i<28;i++){
    const p=document.createElement("div");
    p.className="confetti-piece";
    p.style.left=(x||50)+"%";
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(6+Math.random()*8)+"px";
    p.style.height=(6+Math.random()*8)+"px";
    p.style.borderRadius=Math.random()>.5?"50%":"2px";
    p.style.animationDuration=(.8+Math.random()*1.2)+"s";
    p.style.animationDelay=(Math.random()*.3)+"s";
    p.style.marginLeft=(-50+Math.random()*100)+"px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2500);
  }
}

function showScorePopup(pts,el){
  if(!el)return;
  const rect=el.getBoundingClientRect();
  const p=document.createElement("div");
  p.className="score-popup";
  p.style.left=rect.left+rect.width/2+"px";
  p.style.top=rect.top+"px";
  p.textContent="+"+pts+"⭐";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1000);
}

function updateBodyBg(level){
  document.body.className="";
  document.body.classList.add("lvl-bg-"+Math.min(level,10));
}

function flashOptBtn(idx,isCorrect){
  const btns=document.querySelectorAll(".opt-btn");
  if(btns[idx]){
    btns[idx].classList.add(isCorrect?"correct-flash":"wrong-shake");
    setTimeout(()=>{btns[idx].classList.remove("correct-flash","wrong-shake");},700);
  }
}

let QUESTION_TIME_VAL=ls('tqv3_settings',{questionTime:20}).questionTime||20;
render();
setTimeout(applyAds,100);
